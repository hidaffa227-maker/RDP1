name: RDP
on: [workflow_dispatch]

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          $password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
          New-LocalUser "rdpuser" -Password $password -FullName "RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"

      - name: Setup ngrok tunnel
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          .\ngrok\ngrok.exe authtoken 3M84hKRIgcYURRfKWcsqJTGRJjv_2N8M6XUMBnmeHKVDuiAfD
          Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389" -NoNewWindow

            - name: Show tunnel address
        run: |
          Start-Sleep -s 10
          Invoke-RestMethod http://localhost:4040/api/tunnels | ConvertTo-Json -Depth 5
          
      - name: Keep alive
        run: Start-Sleep -s 21600
